name: Build RemoteKeepAlive APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK
      run: |
        # Install cmdline-tools
        mkdir -p /tmp/android-sdk/cmdline-tools
        cd /tmp/android-sdk/cmdline-tools
        curl -sL -o android-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-10253058_latest.zip"
        unzip -q android-tools.zip
        mv cmdline-tools linux-tools

        # Set ANDROID_HOME and install platform + build tools
        export ANDROID_HOME=/tmp/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/linux-tools/bin:$PATH
        yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
        yes | sdkmanager --licenses > /dev/null

        # Tell Gradle where to find the SDK
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ANDROID_HOME=$ANDROID_HOME"

    - name: Build Debug APK
      run: |
        export ANDROID_HOME=/tmp/android-sdk
        ./gradlew assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: RemoteKeepAlive-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
