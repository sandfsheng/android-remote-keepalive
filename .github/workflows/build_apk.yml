name: Build RemoteKeepAlive APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run Android SDK install from a mirror that the runner can reach
        shell: bash

    env:
      ANDROID_SDK_ROOT: /usr/local/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android command line tools (mirror-friendly)
      run: |
        set -e
        # Use the official Google repository but retry with a different host if blocked.
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        cd "$ANDROID_SDK_ROOT/cmdline-tools"

        # primary
        if ! curl -fSL --retry 3 -o android-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9708926_latest.zip"; then
          echo "Primary mirror failed, trying alternate..."
          curl -fSL --retry 3 -o android-tools.zip "https://mirrors.tuna.tsinghua.edu.cn/android.googlesource.com/platform/tools/+/refs/heads/main/cmdline-tools" || true
        fi

        # sanity: ensure we actually got a zip
        if ! file android-tools.zip | grep -q "Zip archive"; then
          echo "Download is not a valid zip. Trying sdkmanager-free path via prebuilt."
          exit 1
        fi

        unzip -q android-tools.zip
        mv cmdline-tools linux-tools
        cd "$ANDROID_SDK_ROOT/cmdline-tools/linux-tools"
        export PATH="$PWD/bin:$PATH"

        yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
        yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || {
          echo "=== sdkmanager output (diagnostic) ==="
          cat "$ANDROID_SDK_ROOT/cmdline-tools/linux-tools/bin/../../" 2>/dev/null || true
          exit 1
        }

        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

    - name: Build Debug APK
      run: |
        export ANDROID_HOME="$ANDROID_SDK_ROOT"
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RemoteKeepAlive-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
